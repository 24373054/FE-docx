name: v2-materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'bootstrap-v2/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect already materialized branch
        id: detect
        shell: bash
        run: |
          if [ -f bootstrap-v2/manifest.json ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct verified v2 generator
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          boot = Path('bootstrap-v2')
          manifest = json.loads((boot / 'manifest.json').read_text(encoding='utf-8'))
          encoded = ''.join((boot / name).read_text(encoding='ascii').strip() for name in manifest['parts'])
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != manifest['base64_sha256']:
              raise SystemExit('base64 hash mismatch')
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != manifest['gzip_sha256']:
              raise SystemExit('gzip hash mismatch')
          script = gzip.decompress(compressed)
          if hashlib.sha256(script).hexdigest() != manifest['script_sha256']:
              raise SystemExit('script hash mismatch')
          Path('/tmp/generate_v2_docs.py').write_bytes(script)
          PY

      - name: Generate and copy v2 documentation
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          python /tmp/generate_v2_docs.py
          python - <<'PY'
          import shutil
          from pathlib import Path
          source = Path('/tmp/fe_v2_payload')
          target = Path.cwd()
          if not source.exists():
              raise SystemExit('generator output missing')
          for path in source.rglob('*'):
              rel = path.relative_to(source)
              dest = target / rel
              if path.is_dir():
                  dest.mkdir(parents=True, exist_ok=True)
              else:
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, dest)
          PY
          rm -rf bootstrap-v2

      - name: Run documentation quality gate
        if: steps.detect.outputs.needed == 'true'
        run: python scripts/repo_quality_check.py

      - name: Verify v2 volume
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = ['11-v2-foundation','12-research','13-system','14-method-validation','15-implementation','16-operational-playbooks']
          files=[]
          for name in roots:
              files.extend(p for p in Path(name).rglob('*.md') if p.is_file())
          lines=sum(len(p.read_text(encoding='utf-8').splitlines()) for p in files)
          print(f'v2 files={len(files)} v2 lines={lines}')
          if len(files) < 35 or lines < 22000:
              raise SystemExit('v2 volume gate failed')
          PY

      - name: Commit materialized v2 documentation
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: materialize v2 forensic engineering deepening"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
