name: production-materialize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'bootstrap-production/**'

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect pending production generator
        id: detect
        shell: bash
        run: |
          if [ -f bootstrap-production/manifest.json ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify production generator
        if: steps.detect.outputs.needed == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          from pathlib import Path

          boot = Path('bootstrap-production')
          manifest = json.loads((boot / 'manifest.json').read_text(encoding='utf-8'))
          if manifest.get('format') != 'python-generator.xz+base64-parts':
              raise SystemExit('unsupported generator format')

          chunks = []
          for name in manifest['parts']:
              text = (boot / name).read_text(encoding='ascii').strip()
              actual = hashlib.sha256(text.encode('ascii')).hexdigest()
              expected = manifest['part_sha256'][name]
              if actual != expected:
                  raise SystemExit(f'part hash mismatch {name}: {actual}')
              chunks.append(text)

          encoded = ''.join(chunks)
          if len(encoded) != manifest['base64_size_chars']:
              raise SystemExit(f'base64 size mismatch: {len(encoded)}')
          encoded_hash = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_hash != manifest['base64_sha256']:
              raise SystemExit(f'base64 hash mismatch: {encoded_hash}')

          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != manifest['compressed_size_bytes']:
              raise SystemExit(f'compressed size mismatch: {len(compressed)}')
          compressed_hash = hashlib.sha256(compressed).hexdigest()
          if compressed_hash != manifest['compressed_sha256']:
              raise SystemExit(f'compressed SHA-256 mismatch: {compressed_hash}')

          source = lzma.decompress(compressed)
          if len(source) != manifest['source_size_bytes']:
              raise SystemExit(f'source size mismatch: {len(source)}')
          source_hash = hashlib.sha256(source).hexdigest()
          if source_hash != manifest['source_sha256']:
              raise SystemExit(f'source SHA-256 mismatch: {source_hash}')

          marker = b', pandas as pd'
          if source.count(marker) != 1:
              raise SystemExit('unexpected optional pandas import count')
          runtime_source = source.replace(marker, b'')
          if len(runtime_source) != manifest['runtime_source_size_bytes']:
              raise SystemExit(f'runtime source size mismatch: {len(runtime_source)}')
          runtime_hash = hashlib.sha256(runtime_source).hexdigest()
          if runtime_hash != manifest['runtime_source_sha256']:
              raise SystemExit(f'runtime source SHA-256 mismatch: {runtime_hash}')

          Path('/tmp/generate_production_v3.py').write_bytes(runtime_source)
          print(
              f'verified source sha256={source_hash}; '
              f'runtime sha256={runtime_hash}; removed one unused optional import'
          )
          PY

      - name: Generate production v3 in an isolated workspace
        id: generate
        if: steps.detect.outputs.needed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          rm -rf /tmp/fe-docx-production-v3
          mkdir -p /tmp/fe-docx-production-v3
          set +e
          (
            cd /tmp/fe-docx-production-v3
            python /tmp/generate_production_v3.py
          ) > /tmp/production-generator.log 2>&1
          rc=$?
          set -e
          cat /tmp/production-generator.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          test -f /tmp/fe-docx-production-v3/README.md
          test -f /tmp/fe-docx-production-v3/scripts/repo_quality_check.py
          test -f /tmp/fe-docx-production-v3/catalogs/traceability.csv

      - name: Upload generator diagnostic
        if: steps.generate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-generator-diagnostic
          path: /tmp/production-generator.log
          retention-days: 1

      - name: Stop after generator failure
        if: steps.generate.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Replace legacy and parallel documentation with production v3
        if: steps.detect.outputs.needed == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          rm -rf \
            00-governance 01-regulatory 02-product 03-architecture 04-methods \
            05-quality 06-operations 07-organization 08-planning 09-templates \
            10-reference 11-v2-foundation 12-research 13-system \
            14-method-validation 15-implementation 16-operational-playbooks \
            catalogs schemas scripts
          rm -f README.md CONTRIBUTING.md SECURITY.md LICENSE LICENSE.md .gitignore
          rm -f .github/CODEOWNERS .github/pull_request_template.md
          rsync -a --exclude='.github/workflows/' /tmp/fe-docx-production-v3/ ./
          rm -rf /tmp/fe-docx-production-v3 bootstrap-production

      - name: Regenerate and verify production indexes
        if: steps.detect.outputs.needed == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          python scripts/build_document_index.py
          python scripts/build_document_index.py --check

      - name: Run production quality gates
        if: steps.detect.outputs.needed == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          python scripts/repo_quality_check.py
          python scripts/validate_traceability.py
          python scripts/validate_internal_links.py

      - name: Verify production replacement scope
        if: steps.detect.outputs.needed == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          legacy = [
              '11-v2-foundation','12-research','13-system',
              '14-method-validation','15-implementation','16-operational-playbooks'
          ]
          present = [name for name in legacy if Path(name).exists()]
          if present:
              raise SystemExit(f'legacy parallel directories remain: {present}')

          controlled=[]
          for path in Path('.').rglob('*.md'):
              if path.as_posix() in {'README.md','CONTRIBUTING.md','SECURITY.md','LICENSE.md','catalogs/README.md'}:
                  continue
              if path.parts and path.parts[0][:2].isdigit() and 0 <= int(path.parts[0][:2]) <= 10:
                  controlled.append(path)
          lines=sum(len(path.read_text(encoding='utf-8').splitlines()) for path in controlled)
          with Path('catalogs/traceability.csv').open(encoding='utf-8', newline='') as handle:
              links=sum(1 for _ in csv.DictReader(handle))
          print(f'controlled_documents={len(controlled)} controlled_lines={lines} traceability_links={links}')
          if len(controlled) < 108:
              raise SystemExit('controlled document count below production manifest')
          if lines < 35000:
              raise SystemExit('controlled content below production threshold')
          if links < 1600:
              raise SystemExit('traceability coverage below production threshold')
          PY

      - name: Commit materialized production documentation
        if: steps.detect.outputs.needed == 'true' && steps.generate.outcome == 'success'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: establish production v3 single-source system'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
