name: documentation-quality

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.csv'
      - '**/*.json'
      - '**/*.py'
      - '.github/workflows/documentation-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.csv'
      - '**/*.json'
      - '**/*.py'
      - '.github/workflows/documentation-quality.yml'

permissions:
  contents: read

jobs:
  production-documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify generated document index
        run: python scripts/build_document_index.py --check

      - name: Run structural and content quality gate
        run: python scripts/repo_quality_check.py

      - name: Validate requirements-control-test traceability
        run: python scripts/validate_traceability.py

      - name: Validate internal links
        run: python scripts/validate_internal_links.py
