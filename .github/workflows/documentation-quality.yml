name: documentation-quality

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/CODEOWNERS'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/CODEOWNERS'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run repository quality gate
        run: python scripts/repo_quality_check.py

      - name: Validate requirement-control-test traceability when available
        shell: bash
        run: |
          if [ -f scripts/validate_traceability.py ]; then
            python scripts/validate_traceability.py
          else
            echo 'traceability validator not present in this historical baseline; skipping'
          fi
