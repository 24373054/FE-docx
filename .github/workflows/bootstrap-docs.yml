name: bootstrap-documentation

on:
  push:
    branches: ["docs/v1-foundation"]
    paths: ["bootstrap/READY"]

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract reviewed documentation
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          bootstrap = root / "bootstrap"
          manifest = json.loads((bootstrap / "manifest.json").read_text(encoding="utf-8"))
          encoded = "".join((bootstrap / name).read_text(encoding="ascii").strip() for name in manifest["parts"])
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          if actual != manifest["sha256"]:
              raise SystemExit(f"payload hash mismatch: {actual}")

          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  destination = (root / member.name).resolve()
                  if root not in destination.parents and destination != root:
                      raise SystemExit(f"unsafe archive path: {member.name}")
              archive.extractall(root)
          PY

      - name: Remove one-time bootstrap material
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-docs.yml

      - name: Run documentation quality gate
        run: python scripts/repo_quality_check.py

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: establish forensic engineering documentation baseline"
          git push origin HEAD:docs/v1-foundation
