name: bootstrap-documentation

on:
  workflow_dispatch:
  push:
    branches: ["main", "docs/v1-foundation"]
    paths: ["bootstrap/READY"]

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified generator
        shell: bash
        run: |
          cat bootstrap/generator-01.b64 bootstrap/generator-02.b64 > /tmp/generator.b64
          echo "945c5625d1c139e194334b975e3cc90b777cf4bf688c3636aaf25b6e35fe5d50  /tmp/generator.b64" | sha256sum -c -
          base64 -d /tmp/generator.b64 > /tmp/generator.py.gz
          echo "c8da2ead1a7023918424a3ca6779138fb6fcbccd4373487fb780bda4829851c1  /tmp/generator.py.gz" | sha256sum -c -
          gzip -dc /tmp/generator.py.gz > /tmp/generate_docs.py
          echo "727008248c3560f96a65310ca7b345560bb402aadca7028db865d048fb77dd92  /tmp/generate_docs.py" | sha256sum -c -

      - name: Generate documentation baseline
        run: python /tmp/generate_docs.py

      - name: Prepare push-safe repository tree
        run: |
          # GitHub Actions' built-in token may update repository contents but is
          # not allowed to create, update, or delete workflow files. Keep this
          # bootstrap workflow unchanged for the push and remove the generated
          # continuous-quality workflow from the working tree. The connected
          # GitHub App will delete this bootstrap workflow after verification.
          rm -rf bootstrap
          rm -f .github/workflows/documentation-quality.yml

      - name: Run documentation quality gate
        run: python scripts/repo_quality_check.py

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: establish forensic engineering documentation baseline"
          git push origin "HEAD:${GITHUB_REF_NAME}"
